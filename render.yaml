services:
  - type: web
    name: backend
    env: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm run start:dev
    envVars:
      groups:
          - Mashback-App

  - type: web
    name: admin
    env: node
    plan: free
    rootDir: apps/admin
    buildCommand: npm install && npm run build
    startCommand: npm run dev
    envVars:
      - key: VITE_PORT
        value: https://monorepo-backend.onrender.com